<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Birthday! 🎂</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
/* Cari bagian ini di dalam tag <style> index.html dan ubah height-nya */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh; /* Ganti 100% menjadi 100dvh */
      overflow: hidden;
      background-color: #d68fa8; 
      font-family: "Pixelify Sans", sans-serif;
    }

    /* Iframe akan mengambil 100% layar HP/Browser */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Layar Pop-up untuk memancing klik pertama (Syarat Autoplay Browser) */
    #mulai-musik {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #f6a8c4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: pointer;
      color: #2a1a1a;
      transition: opacity 0.5s ease;
    }

    #mulai-musik h2 {
      margin-bottom: 10px;
      font-size: 24px;
    }

    #mulai-musik p {
      font-size: 16px;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .sembunyi {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- 1. Taruh lagu kamu di sini (pastikan path-nya benar) -->
  <audio id="bgm" src="assets/lagu-favorit.mp3" loop></audio>

  <!-- 2. Layar sentuh pertama -->
  <div id="mulai-musik">
    <h2><p>Pencettt sayanggg ❤︎❤︎❤︎</p></h2>
  </div>

  <!-- 3. Memuat halaman covermu di dalam iframe -->
  <!-- Saat Zahra pindah halaman, yang berubah hanya di dalam iframe ini. Lagu aman! -->
  <iframe id="frame-web" src="cover.html"></iframe>

  <script>
    const overlay = document.getElementById('mulai-musik');
    const bgm = document.getElementById('bgm');

    // Saat layar pertama diketuk, putar lagu dan hilangkan overlay
    overlay.addEventListener('click', () => {
      bgm.play();
      overlay.classList.add('sembunyi');
      
      // Hapus div-nya setelah animasi transisi selesai agar tidak berat
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 500);
    });
  </script>
</body>
</html>
