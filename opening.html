<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Untuk Kamu 💌</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="opening.css">
</head>
<body>

  <main class="phone">
    <section class="screen opening-screen" id="opening-screen">
      <img class="bg" src="assets/Opening/bg.png" alt="">

      <!-- Pesan 1 -->
      <div class="msg1-wrap">
        <img class="msg1-bubble" src="assets/Opening/bubble-happybday.png" alt="">
        <p class="msg1-text" id="msg1-text"></p>
      </div>

      <!-- Pesan 2 -->
      <img class="rose" src="assets/Opening/rose.png" alt="">
      <div class="msg2-wrap">
        <img class="msg2-bubble" src="assets/Opening/bubble-outline-a.png" alt="">
        <p class="msg2-text" id="msg2-text"></p>
      </div>

      <!-- Pesan 3 -->
      <img class="hibiscus" src="assets/Opening/hibiscus.png" alt="">
      <div class="msg3-wrap">
        <img class="msg3-bubble" src="assets/Opening/bubble-outline-b.png" alt="">
        <p class="msg3-text" id="msg3-text"></p>
      </div>

      <img class="bouquet" src="assets/Opening/bouquet.png" alt="">

      <button class="next-btn" id="next-btn" aria-label="Lanjut ke Our Story">
        <img src="assets/Opening/next-arrow.png" alt="">
      </button>
    </section>
  </main>

<script src="opening.js"></script>
</body>
</html>
