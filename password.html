<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kunci Ulang Tahun 🔒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="password.css">
</head>
<body>

  <main class="phone">
    <section class="screen password-screen" id="password-screen">
      <img class="bg" src="assets/Password/bg.png" alt="">
      <img class="halftone" src="assets/Password/halftone.png" alt="">

      <img class="wood" src="assets/Password/wood.png" alt="">
      <img class="animals" src="assets/Password/animals.png" alt="">
      <img class="hint-bubbles" src="assets/Password/hint-bubbles.png" alt="">

      <img class="hint-butterfly" src="assets/Password/hint-butterfly.png" alt="petunjuk: tanggal jadian">

      <img class="input-art" src="assets/Password/input-box.png" alt="">
      <input class="pw-input" type="text" inputmode="numeric" autocomplete="off"
             maxlength="8" placeholder="" aria-label="Masukkan tanggal jadian">

      <img class="start-art" src="assets/Password/start-btn.png" alt="">
      <button class="start-btn" type="button" aria-label="Mulai"></button>

      <p class="pw-error" id="pw-error">coba lagi ya~</p>
    </section>
  </main>

<script src="password.js"></script>
</body>
</html>
