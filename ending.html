<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday! 🎉</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ending.css">
</head>
<body>

  <main class="phone">
    <section class="screen ending-screen" id="ending-screen">
      <!-- Background Utama (Langit & Gunung) -->
      <img class="bg" src="assets/Ending/bg.png" alt="">

      <!-- Ornamen Bintang -->
      <img class="deco-stars" src="assets/Ending/stars.png" alt="">
      
      <!-- Ornamen Pita -->
      <img class="deco-bow" src="assets/Ending/bow.png" alt="">

      <!-- Tipografi Tengah -->
      <div class="text-group">
        <img class="text-happy" src="assets/Ending/happy.png" alt="Happy">
        <img class="deco-heart" src="assets/Ending/heart.png" alt="">
        <img class="text-birthday" src="assets/Ending/birthday.png" alt="Birthday">
        <img class="text-zahra" src="assets/Ending/zahra.png" alt="Zahra">
      </div>

      <!-- Burung Merpati -->
      <img class="dove dove-left" src="assets/Ending/dove-left.png" alt="">
      <img class="dove dove-right" src="assets/Ending/dove-right.png" alt="">

      <!-- Tombol Menu -->
      <button class="menu-btn" id="btn-menu" aria-label="Kembali ke Menu Awal">
        <img src="assets/Ending/btn-menu.png" alt="Menu">
      </button>

    </section>
  </main>

<script src="ending.js"></script>
</body>
</html>
