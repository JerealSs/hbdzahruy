<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Selamat Ulang Tahun 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="phone">

    <!-- ===== SECTION 1: COVER ===== -->
    <section class="screen cover" id="cover">
      <img class="bg" src="assets/cover/bg.png" alt="">

      <img class="stars" src="assets/cover/Group 2.png" alt="">

      <img class="sun" src="assets/cover/sun.png" alt="matahari pixel tersenyum">

      <img class="butterflies" src="assets/cover/butterflies.png" alt="">

      <img class="person" src="assets/cover/person.png" alt="foto Zahra">

<div class="bubble-wrap">
        <img class="bubble-img" src="assets/cover/bubble.png" alt="Bubble">
        <!-- Wadah teks berjalan -->
        <div class="bubble-text-container">
          <span id="typed-text"></span><span class="cursor">|</span>
        </div>
      </div>

      <img class="flowers" src="assets/cover/flowers.png" alt="">

      <div class="scroll-hint" id="go-next">
        <span>ketuk untuk lanjut</span>
        <div class="arrow"></div>
      </div>
    </section>
 

    <!-- section berikutnya menyusul di sini -->

  </main>

<script src="script.js"></script>
</body>
</html>
